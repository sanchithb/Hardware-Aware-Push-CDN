<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hpcdn console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 22V10h3v4.5h5V10h3v12h-3v-4.7h-5V22z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div>
        <div class="brand-name">hpcdn</div>
        <div class="brand-sub">delivery console</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">Operate</div>
      <a href="#/" data-nav="overview">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8.5 8 2l6.5 6.5M3.5 7.5v6h9v-6"/></svg>
        Overview</a>
      <a href="#/nodes" data-nav="nodes">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="3" r="1.8"/><circle cx="3" cy="12" r="1.8"/><circle cx="13" cy="12" r="1.8"/><path d="M7 4.5 4 10.3M9 4.5l3 5.8M5 12h6"/></svg>
        Nodes</a>
      <a href="#/events" data-nav="events">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8h3l2-5 2 10 2-5h3"/></svg>
        Events &amp; logs</a>

      <div class="nav-label">Configure</div>
      <a href="#/enroll" data-nav="enroll">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="3.5"/><path d="M8.5 8.5 14 14M11 11l1.8-1.8"/></svg>
        Enroll nodes</a>
      <a href="#/settings" data-nav="settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></svg>
        Routing settings</a>
    </nav>

    <div class="side-foot">
      <div class="row">
        <span>theme</span>
        <button id="theme-toggle" class="btn small">toggle</button>
      </div>
      <div class="row">
        <span>session</span>
        <button id="logout" class="btn small">sign out</button>
      </div>
      <div>hpcdn · self-hosted CDN</div>
    </div>
  </aside>

  <main class="main">
    <div id="view"></div>
  </main>
</div>

<div id="gate" class="gate hidden">
  <div class="card gate-card">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div>
        <div class="brand-name">hpcdn console</div>
        <div class="brand-sub">controller sign-in</div>
      </div>
    </div>
    <p>Paste the admin API key printed when the controller first started
       (or the contents of <code>admin.key</code> in its data directory).</p>
    <div class="field">
      <label for="gate-key">Admin API key</label>
      <input id="gate-key" type="password" placeholder="hpa_…" autocomplete="off">
    </div>
    <button id="gate-go" class="btn primary">Connect</button>
    <div id="gate-err" class="gate-err"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
